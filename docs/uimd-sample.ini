; ============================================================================
; WatchBar 1.3.0 - 观战面板参数
; ----------------------------------------------------------------------------
; 面板没有独立的 ini 文件：全部参数位于游戏自己的 uimd.ini 的 [WatchBar] 节，
; 键名为 WatchBar.<键>。把下面整段追加到 mod 的 uimd.ini 末尾即可（uimd.ini 打包在
; MIX 内时，用 XCC Mixer 解包、修改后回封）。
;
; 本文件每一行都是内置默认值；不写 [WatchBar] 节时行为与之一致。
; 改完必须重开游戏：uimd.ini 由引擎在启动时读取一次。
;
; 写法：行首 ; 或 # 为注释，注释请单独占一行（写在取值后面可能被当成取值的一部分）；
; 键名大小写不敏感，WatchBar. 前缀可省略（本文件统一写上）；整数可写十进制或 0x
; 十六进制；布尔写 1/0，也接受 yes/no、true/false、on/off；颜色写 R,G,B（0..255）
; 或 0xRRGGBB。
;
; MaxRows / MaxLinesPerPlayer / LinesCap / IconsPerLine 决定 DLL 内部数组尺寸，有硬
; 上限：写入更大的值会被夹到上限并记入日志。全部键的完整说明见 docs/config.md。
; ============================================================================

[WatchBar]

; ---- 几何布局 -------------------------------------------------------------
; 单位为像素。面板上边缘与左边缘是屏幕绝对坐标；可视带下边缘按视口底边
; （DSurface::ViewBounds）计算，不含侧边栏与黑边。

; 面板左边缘。0 = 紧贴视口左边。
WatchBar.PanelX=0

; 面板上边缘 = TopMargin + 视口高 × TopPercent%。用百分比是为了在不同分辨率下保持
; 相同的画面占比。
WatchBar.TopMargin=10
WatchBar.TopPercent=25

; 可视带下边缘 = 视口底部 - BandMargin。超出的图标行整行不绘制，进入滚动区。
WatchBar.BandMargin=4

; 标签列宽度：国旗 + 玩家名。默认 60 = 47px 国旗居中 + 名字。
WatchBar.LabelWidth=60

; 一个 cameo 格子的尺寸（含边框），应与所用边框素材的格子尺寸一致。
WatchBar.CellWidth=62
WatchBar.CellHeight=50

; 玩家行之间的竖直间距。
WatchBar.RowGap=2

; 一行（列）放几个图标后换行。硬上限 16。
WatchBar.IconsPerLine=4

; 每个玩家最多几行图标。硬上限 8。仅 LinesMode=fixed 时读取。
WatchBar.MaxLinesPerPlayer=3

; 每个玩家的行数从哪来：
;   fixed   = 用上面的 MaxLinesPerPlayer
;   compact = 自适应：可视带能放下的整行数按玩家数分配，保证面板不滚动
;   loose   = 同上，总预算再加 1 行 × 玩家数（人人内容都多时相当于 n+1，会滚动）
;   ultra   = 同上，再加 2 行 × 玩家数（相当于 n+2）
; 自适应时不读 MaxLinesPerPlayer，上限由 LinesCap 决定；每行至少 1 行，用不掉的行
; 让给内容多的玩家。tools\check_ini.bat 可离线打印各分辨率下的行数表。
WatchBar.LinesMode=fixed

; 自适应模式下每位玩家的行数上限。硬上限 8。fixed 时无效。
WatchBar.LinesCap=8

; 最多显示几行（几个玩家）。硬上限 8。
WatchBar.MaxRows=8

; cameo 图案尺寸与它在格子内的偏移。默认 60x48 @ (1,1)，落在 62x50 边框的凹槽内。
WatchBar.CameoWidth=60
WatchBar.CameoHeight=48
WatchBar.CameoOffsetX=1
WatchBar.CameoOffsetY=1

; 国旗素材尺寸（仅用于居中计算）。文件名读取国家自己那一节的 File.Flag=。
WatchBar.FlagWidth=47
WatchBar.FlagHeight=23

; 右侧开关条的尺寸。默认 10x50 = swsideNNon/off.pcx 原生尺寸。
WatchBar.ToggleWidth=10
WatchBar.ToggleHeight=50

; ▲▼ 翻页按钮的尺寸。与开关条无关。写了 UpPCX / DownPCX 时素材按这个尺寸直接贴图，
; 不做缩放：素材实际尺寸与这两项不一致时改这里，不要让素材拉伸。
WatchBar.ScrollButtonWidth=10
WatchBar.ScrollButtonHeight=14

; ▲▼ 一对并拢贴在一起，整体居中在面板实际占用宽度的中间；本项是这个居中位置上的
; 左右平移量（正数向右），面板太窄放不下时向左被夹在面板左边缘。
WatchBar.ScrollButtonOffsetX=0

; ---- 素材 ----------------------------------------------------------------
; 边框、开关条、▲▼ 按钮与国旗的文件名不在参数中，而在 rulesmd.ini 中管理对应图片
; 的那一节，见本文件末尾。

; 建造进度时钟：1 = 绘制 gclock2 时钟扫过（进度的唯一显示）；0 = 在 cameo 中央显示
; 百分比数字。素材缺失时自动退回数字显示。
WatchBar.ClockEnabled=1

; ---- 颜色（R,G,B，0..255）-------------------------------------------------

; 建筑造好、等待放置时的文字颜色。
WatchBar.DoneColor=120,255,140

; 无时钟时显示的进度数字颜色。
WatchBar.ProgressTextColor=255,255,255

; 排队数量 "+N" 的颜色。
WatchBar.QueueTextColor=205,205,205

; 单位数量角标的底板与文字颜色。
WatchBar.CountChipColor=36,36,36
WatchBar.CountTextColor=255,255,255

; 尚无对局数据时的占位文字颜色（默认文字取 CSF 标签 TXT_WAITING）。
WatchBar.IdleTextColor=130,130,130

; 面板左缘 2px 滚动指示条的轨道与滑块颜色。
WatchBar.ScrollTrackColor=40,40,40
WatchBar.ScrollThumbColor=185,185,185

; ▲▼ 自绘三角的颜色：可滚动 / 已到顶端或底端 / 按住中。
WatchBar.ScrollGlyphActiveColor=200,200,200
WatchBar.ScrollGlyphIdleColor=110,110,110
WatchBar.ScrollGlyphHeldColor=255,255,255

; 开关条中间的方块：展开 / 收起。
WatchBar.ToggleGlyphOnColor=210,210,210
WatchBar.ToggleGlyphOffColor=70,70,70

; ---- 界面文字 -------------------------------------------------------------
; 两个值都先当作 CSF 标签查游戏字符串表（默认值因此跟随游戏语言），查不到时按字面
; 文本绘制，所以直接写中文或英文也照常工作；只有纯 ASCII 的值会去查表。
; 值按 UTF-8 解码，失败再按系统 ANSI 代码页解码，两种编码保存都能读到。含 CJK 的
; 字符串由游戏用中文字体渲染，该字体没有 % 字形，值中不要用百分号。
; 字体不可配置：GAME.FNT 未逆向，Point8 是已验证可正常渲染的最大字号。

; 建筑造好、等待放置时覆盖在图标上的文字（浅绿色，居中）。
WatchBar.DoneText=TXT_READY

; 尚无对局数据时的占位文字。
WatchBar.IdleText=TXT_WAITING

; ---- 动画与滚动 -----------------------------------------------------------

; 图标淡入/淡出时长（毫秒）。0 = 关闭淡入淡出（图标直接出现/消失）。
WatchBar.FadeMs=100

; 图标补位滑动时长（毫秒）。0 = 关闭滑动补位。大于 0 时必须小于 FadeMs，写错会被
; 自动改为 FadeMs-1 并记入日志。
WatchBar.MoveMs=90

; ▲▼ 每次滚动几行：数字 = 固定行数；page = 一整屏（能显示 6 行则滚 6 行），也可写
; max / visible。按住连滚的每一步使用同一值。
WatchBar.ScrollStep=1

; 按住多久后开始连滚，以及连滚时每步的间隔（毫秒）。
WatchBar.ScrollRepeatDelayMs=350
WatchBar.ScrollRepeatRateMs=120

; ---- 显示内容 -------------------------------------------------------------
; 图标从左到右分为五块，默认顺序为：
;   在造建筑+军械(production) → 现存建筑(building) → 载具(vehicle)
;   → 飞机(aircraft) → 步兵(infantry)
; 每块内部各自排序（见 SortMode），块与块的先后由 GroupOrder 决定。

; 是否显示正在建造的建筑/军械（production 块，最多两格：建筑页签与军械页签）。
WatchBar.ShowStructures=1

; 是否显示现存单位。这是单位块的总开关：步兵、载具、飞机三块都受它控制。
WatchBar.ShowUnits=1

; 计数开关：哪些类别按地图上现存数量计数（右上角白色数字角标）。
; CountBuilding 独立于 ShowUnits：1 = 已放置的建筑也计数，围墙、激光墙、火风暴墙
; 不计。CountInfantry / CountVehicle / CountAircraft 仅在 ShowUnits=1 时生效。
WatchBar.CountBuilding=0
WatchBar.CountInfantry=1
WatchBar.CountVehicle=1
WatchBar.CountAircraft=1

; 每一块最多占几格：逗号列表 <组名>:<格数>，格数 1..128，未列出的组不封顶。
; 留空 = 保持默认（建筑仍为 3 格），不是取消封顶。例：building:2,infantry:4
WatchBar.MaxIconsPerGroup=building:3

; 五块从左到右的排列顺序，五个组名必须各写一次（写错、重复或漏写时保留默认顺序并
; 记一行日志）。排在最后的块最先被整行格数截断。
;   默认：             production,building,vehicle,aircraft,infantry
;   按侧边栏页签顺序： production,building,infantry,vehicle,aircraft
WatchBar.GroupOrder=production,building,vehicle,aircraft,infantry

; 是否显示单位数量角标。关闭后只有图标，不显示数量。
WatchBar.ShowCountChip=1

; 计数块内的排序方式：tech = 科技等级高到低；count = 数量多到少；name = 规则名 A 到 Z。
WatchBar.SortMode=tech

; 重新扫描战场数据的间隔（毫秒）。0 = 每帧扫描；单位数量很大的 mod 可设为 100 以减少
; 开销（动画与绘制仍为每帧，只是数据刷新变慢）。
WatchBar.ScanIntervalMs=0

; ---- 显示条件 -------------------------------------------------------------

; 1 = 只有观战者能看到面板。0 = 参战者也显示（调布局用）；发布版本应保持为 1。
WatchBar.SpectatorOnly=1

; 参战者能看到的行（只在 SpectatorOnly=0 时读取；观战者不受本项影响）。
;   own = 只有自己的房子；allies = 自己 + 盟友；all = 全部参战者。
WatchBar.ParticipantRows=own

; 1 = 被打败或认输的玩家也视为观战者，能看到面板。
WatchBar.ShowWhenDefeated=1

; ---- 日志 -----------------------------------------------------------------

; 1 = 写日志。发布版本可设为 0。
WatchBar.LogEnabled=1

; 详细程度：0 不写；1 只写 WARNING / ERROR；2 加上状态变化；3 全部（当前与 2 相同）。
WatchBar.LogLevel=2

; 日志体积上限（KB），超过后停止写入。
WatchBar.LogMaxKB=1024

; 日志路径。留空 = 游戏根目录\WatchBar.log。
WatchBar.LogPath=

; ---- 记录用（读取但忽略） -------------------------------------------------
; 仅作记录，程序不读取，不影响面板行为。
WatchBar.Version=1.3.0
WatchBar.Notes=


; ============================================================================
; 素材：写在 rulesmd.ini 中对应阵营 / 国家的那一节
; ----------------------------------------------------------------------------
; 面板不按 %d 推算素材名，而是读取对应节中已有的那一行：
;
;   [GDI]                                   ; 阵营自己的节（[Sides] 中的名字）
;   WatchBar.CenterPCX=swside01center.pcx   ; 格子边框
;   WatchBar.OnPCX=swside01on.pcx           ; 开关条：面板展开
;   WatchBar.OffPCX=swside01off.pcx         ; 开关条：面板收起
;   WatchBar.UpPCX=swside01up.pcx           ; 翻页按钮：并拢一对中的左键（向上）
;   WatchBar.DownPCX=swside01down.pcx       ; 翻页按钮：并拢一对中的右键（向下）
;
;   [British]                               ; 国家自己的节，引擎绘制国旗本来就用这一行
;   File.Flag=C4_FLAG.PCX
;
; 五个 WatchBar.*PCX 都可不写，而且只读取这五个键（不读取其他 mod 的侧边栏配置）。
; 不写时格子不绘制底色（cameo 直接画在战场上）、开关条退化为一条横线、翻页按钮退回
; 代码自绘的三角，面板仍可使用。整板使用本机玩家自己阵营的皮肤，不按行切换。
; 国旗的文件名只来自 File.Flag 这一行，不按国家索引拼 cN_flag.pcx。
; ============================================================================
